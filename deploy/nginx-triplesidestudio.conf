server {
    server_name triplesidestudio.com www.triplesidestudio.com;

    if ($host = www.triplesidestudio.com) {
        return 301 https://triplesidestudio.com$request_uri;
    }

    root /home/triplesidestudio/tripleside/frontend/build;
    index index.html;

    client_max_body_size 501M;
	# ==========================
	# SECURITY HEADERS
	# ==========================

	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	add_header Cross-Origin-Opener-Policy "same-origin" always;
	add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    location = /docs { return 404; access_log off; }
    location = /redoc { return 404; access_log off; }
    location = /openapi.json { return 404; access_log off; }

    location = /robots.txt {
        try_files /robots.txt =404;
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000/api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        access_log off;
    }

    # Serve meaningful HTML before the React SPA loads so crawlers do not
    # classify the blog and article pages as soft 404 responses.
    location = /blog/ {
        return 301 https://triplesidestudio.com/blog;
    }

    location = /blog {
        proxy_pass http://127.0.0.1:8000/api/seo/blog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = /index.html;
    }

    location ~ ^/blog/([A-Za-z0-9._~-]+)$ {
        rewrite ^/blog/(.+)$ /api/seo/blog/$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = /index.html;
    }
    # Consolidate a product URL that Google indexed before the product was removed.
    location = /shop/6c4f2be3-4803-426a-8d40-8a8fa30392c5 {
        return 301 https://triplesidestudio.com/shop;
    }

    location ~ ^/api/(?:auth/login|customer/(?:login|register|forgot-password|reset-password))$ {
        limit_req zone=tripleside_auth burst=10 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/admin/upload/product {
        client_max_body_size 5G;
        client_body_timeout 3600s;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/download/file/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Block hidden files (.env, .git, dll)
    location ~ /\.(?!well-known) {
    deny all;
    access_log off;
    log_not_found off;
    }

    location ~* \.(env|ini|log|bak|old|zip|sql|tar|gz)$ {
    deny all;
    access_log off;
    log_not_found off;
    }

    location ~ ^/(?:login|register(?:/verify)?|forgot-password|reset-password|dashboard|payment(?:/|$)|admin(?:/|$)) {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/triplesidestudio.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/triplesidestudio.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    listen 80;
    listen [::]:80;
    server_name triplesidestudio.com www.triplesidestudio.com;

    return 301 https://triplesidestudio.com$request_uri;
}
