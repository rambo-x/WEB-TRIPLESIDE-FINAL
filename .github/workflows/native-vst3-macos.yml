name: Native VST3 macOS smoke build

on:
  workflow_dispatch:
    inputs:
      visual_render_url:
        description: Browser visual-render endpoint
        required: true
        default: https://triplesidestudio.com/vst-visual-render
        type: string

permissions:
  contents: read

concurrency:
  group: native-vst3-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  universal-vst3:
    name: Universal VST3 (arm64 + Intel)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout TripleSide
        uses: actions/checkout@v4

      - name: Checkout Steinberg VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          path: .build-deps/vst3sdk
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: native-vst3/tools/requirements-visual.txt

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: macos-playwright-${{ hashFiles('native-vst3/tools/requirements-visual.txt') }}

      - name: Cache compiler objects
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: macos-vst3-ccache-${{ runner.arch }}-${{ hashFiles('native-vst3/Source/**', 'native-vst3/CMakeLists.txt') }}
          restore-keys: |
            macos-vst3-ccache-${{ runner.arch }}-

      - name: Install build dependencies
        run: |
          brew list ninja >/dev/null 2>&1 || brew install ninja
          brew list ccache >/dev/null 2>&1 || brew install ccache
          python -m pip install -r native-vst3/tools/requirements-visual.txt
          python -m playwright install chromium

      - name: Build Universal VST3
        env:
          CCACHE_DIR: ~/.cache/ccache
          CCACHE_MAXSIZE: 2G
        run: |
          mkdir -p "$RUNNER_TEMP/tripleside-empty-samples" "$RUNNER_TEMP/tripleside-macos-output"
          native-vst3/build-macos.sh \
            --spec native-vst3/tests/fixtures/colored-keyboard-smoke.json \
            --samples-dir "$RUNNER_TEMP/tripleside-empty-samples" \
            --output-dir "$RUNNER_TEMP/tripleside-macos-output" \
            --vst3-sdk-dir "$GITHUB_WORKSPACE/.build-deps/vst3sdk" \
            --visual-render-url "${{ inputs.visual_render_url }}" \
            --architectures 'arm64;x86_64' \
            --build-jobs "$(sysctl -n hw.ncpu)"
          ccache --show-stats

      - name: Exercise installer and uninstaller
        run: |
          output="$RUNNER_TEMP/tripleside-macos-output"
          artifact_count="$(find "$output/artifacts" -maxdepth 1 -type f -name '*-macos-installer-and-uninstaller.zip' | wc -l | tr -d ' ')"
          test "$artifact_count" = 1
          archive="$(find "$output/artifacts" -maxdepth 1 -type f -name '*-macos-installer-and-uninstaller.zip' -print -quit)"
          download="$output/download"
          mkdir -p "$download"
          ditto -x -k "$archive" "$download"
          package_count="$(find "$download" -maxdepth 1 -type f -name '*-macos-installer.pkg' | wc -l | tr -d ' ')"
          uninstaller_count="$(find "$download" -maxdepth 1 -type d -name 'Uninstall *.app' | wc -l | tr -d ' ')"
          test "$package_count" = 1
          test "$uninstaller_count" = 1
          package="$(find "$download" -maxdepth 1 -type f -name '*-macos-installer.pkg' -print -quit)"
          uninstaller="$(find "$download" -maxdepth 1 -type d -name 'Uninstall *.app' -print -quit)"
          bundle_name="$(basename "$package" -macos-installer.pkg)"
          package_slug="$(printf '%s' "$bundle_name" | tr '[:upper:]_' '[:lower:]-' | tr -cd 'a-z0-9-')"
          package_id="com.triplesidestudio.vst3.${package_slug:-plugin}"
          installed_bundle="/Library/Audio/Plug-Ins/VST3/${bundle_name}.vst3"
          sudo installer -pkg "$package" -target /
          test -d "$installed_bundle"
          installed_module="$(find "$installed_bundle/Contents/MacOS" -maxdepth 1 -type f -print -quit)"
          test -n "$installed_module"
          lipo "$installed_module" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$installed_bundle"
          pkgutil --pkg-info "$package_id" >/dev/null
          sudo "$uninstaller/Contents/MacOS/uninstall" --silent
          test ! -e "$installed_bundle"
          if pkgutil --pkg-info "$package_id" >/dev/null 2>&1; then
            echo "Uninstaller meninggalkan receipt paket $package_id" >&2
            exit 1
          fi

      - name: Upload macOS VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: tripleside-macos-vst3-universal
          path: |
            ${{ runner.temp }}/tripleside-macos-output/artifacts/*.pkg
            ${{ runner.temp }}/tripleside-macos-output/artifacts/*.zip
          if-no-files-found: error
          retention-days: 7
