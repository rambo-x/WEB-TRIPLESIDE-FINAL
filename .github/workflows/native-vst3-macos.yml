name: Native VST3 macOS smoke build

on:
  workflow_dispatch:
    inputs:
      visual_render_url:
        description: Browser visual-render endpoint
        required: true
        default: https://triplesidestudio.com/vst-visual-render
        type: string

permissions:
  contents: read

concurrency:
  group: native-vst3-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  universal-vst3:
    name: Universal VST3 (arm64 + Intel)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout TripleSide
        uses: actions/checkout@v4

      - name: Checkout Steinberg VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          path: .build-deps/vst3sdk
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: native-vst3/tools/requirements-visual.txt

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: macos-playwright-${{ hashFiles('native-vst3/tools/requirements-visual.txt') }}

      - name: Cache compiler objects
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: macos-vst3-ccache-${{ runner.arch }}-${{ hashFiles('native-vst3/Source/**', 'native-vst3/CMakeLists.txt') }}
          restore-keys: |
            macos-vst3-ccache-${{ runner.arch }}-

      - name: Install build dependencies
        run: |
          brew list ninja >/dev/null 2>&1 || brew install ninja
          brew list ccache >/dev/null 2>&1 || brew install ccache
          python -m pip install -r native-vst3/tools/requirements-visual.txt
          python -m playwright install chromium

      - name: Build Universal VST3
        env:
          CCACHE_DIR: ~/.cache/ccache
          CCACHE_MAXSIZE: 2G
        run: |
          mkdir -p "$RUNNER_TEMP/tripleside-empty-samples" "$RUNNER_TEMP/tripleside-macos-output"
          native-vst3/build-macos.sh \
            --spec native-vst3/tests/fixtures/mixforge-effect.json \
            --samples-dir "$RUNNER_TEMP/tripleside-empty-samples" \
            --output-dir "$RUNNER_TEMP/tripleside-macos-output" \
            --vst3-sdk-dir "$GITHUB_WORKSPACE/.build-deps/vst3sdk" \
            --visual-render-url "${{ inputs.visual_render_url }}" \
            --architectures 'arm64;x86_64' \
            --build-jobs "$(sysctl -n hw.ncpu)"
          ccache --show-stats

      - name: Upload macOS VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: tripleside-macos-vst3-universal
          path: |
            ${{ runner.temp }}/tripleside-macos-output/artifacts/*.pkg
            ${{ runner.temp }}/tripleside-macos-output/artifacts/*.zip
          if-no-files-found: error
          retention-days: 7
