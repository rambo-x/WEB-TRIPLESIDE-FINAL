name: Native VST3 Windows installer smoke build

on:
  workflow_dispatch:
    inputs:
      visual_render_url:
        description: Browser visual-render endpoint
        required: true
        default: https://triplesidestudio.com/vst-visual-render
        type: string

permissions:
  contents: read

concurrency:
  group: native-vst3-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    name: Windows VST3 installer EXE
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout TripleSide
        uses: actions/checkout@v4

      - name: Checkout Steinberg VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          path: .build-deps/vst3sdk
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: native-vst3/tools/requirements-visual.txt

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: windows-playwright-${{ hashFiles('native-vst3/tools/requirements-visual.txt') }}

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install -r native-vst3/tools/requirements-visual.txt
          python -m playwright install chromium

      - name: Build VST3 installer
        shell: pwsh
        run: |
          $samples = Join-Path $env:RUNNER_TEMP "tripleside-empty-samples"
          $output = Join-Path $env:RUNNER_TEMP "tripleside-windows-output"
          New-Item -ItemType Directory -Force -Path $samples, $output | Out-Null
          native-vst3/build-windows.ps1 `
            -Spec native-vst3/tests/fixtures/colored-keyboard-smoke.json `
            -SamplesDir $samples `
            -OutputDir $output `
            -Vst3SdkDir "$env:GITHUB_WORKSPACE\.build-deps\vst3sdk" `
            -VisualRenderUrl "${{ inputs.visual_render_url }}" `
            -BuildJobs 2

      - name: Exercise installer and uninstaller
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "tripleside-windows-output"
          $artifacts = Join-Path $output "artifacts"
          $archives = @(Get-ChildItem -LiteralPath $artifacts -Filter "*-windows-vst3-installer.zip")
          if ($archives.Count -ne 1) { throw "Expected exactly one Windows installer ZIP." }
          $download = Join-Path $output "download"
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $download
          $installers = @(Get-ChildItem -LiteralPath $download -Filter "*-windows-vst3-setup.exe")
          $portableUninstallers = @(Get-ChildItem -LiteralPath $download -Filter "*-windows-vst3-uninstall.exe")
          if ($installers.Count -ne 1) { throw "Downloaded ZIP must contain exactly one Windows installer." }
          if ($portableUninstallers.Count -ne 1) { throw "Downloaded ZIP must contain exactly one portable Windows uninstaller." }
          $installer = $installers[0]
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "--silent", "/LOG=$output\install.log" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer smoke test failed with exit code $($install.ExitCode)." }
          $installedBundle = "C:\Program Files\Common Files\VST3\MixForge_Native_Smoke.vst3"
          if (-not (Test-Path -LiteralPath $installedBundle -PathType Container)) { throw "Installed VST3 bundle was not found." }
          $uninstallRoot = "C:\ProgramData\TripleSide Studio\Uninstall\MixForge_Native_Smoke"
          $registeredUninstaller = Join-Path $uninstallRoot "uninstall.exe"
          if (-not (Test-Path -LiteralPath $registeredUninstaller -PathType Leaf)) { throw "Expected the dedicated registered uninstaller." }
          $registryKey = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\com.triplesidestudio.vst3.mixforge-native-smoke"
          if (-not (Test-Path -LiteralPath $registryKey)) { throw "Installer did not register the product in Windows Settings > Apps." }
          $uninstall = Start-Process -FilePath $portableUninstallers[0].FullName -ArgumentList "--silent", "/LOG=$output\uninstall.log" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Portable uninstaller smoke test failed with exit code $($uninstall.ExitCode)." }
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path -LiteralPath $uninstallRoot) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
          if (Test-Path -LiteralPath $installedBundle) { throw "Uninstaller left the exact VST3 bundle installed." }
          if (Test-Path -LiteralPath $registryKey) { throw "Uninstaller left the Windows Apps registration installed." }
          if (Test-Path -LiteralPath $uninstallRoot) { throw "Uninstaller left its product directory installed." }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tripleside-windows-vst3-installer
          path: |
            ${{ runner.temp }}/tripleside-windows-output/artifacts/*.exe
            ${{ runner.temp }}/tripleside-windows-output/artifacts/*.zip
          if-no-files-found: error
          retention-days: 7
